<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Maintenance Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }

    .box {
      max-width: 450px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      margin-top: 10px;
      font-size: 18px;
    }

    button {
      font-weight: bold;
    }

    #status {
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>Maintenance Web Test</h2>

  <p>Nhập dữ liệu</p>

  <input id="data" value="A">

  <button onclick="submitData()">
    SUBMIT
  </button>

  <div id="status">
    Ready
  </div>

</div>

<script>

const FLOW_URL = "https://default9b9edfb8440846c9a75d84dd9e39ae.2f.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/20/workflows/5c67679b0e3c4c1cb23f2f7aac82c96d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=E4vJqZ8wJyS0-Zt3OJ2boYxmk0XW1jK_CZbhD4y3vFg";

async function submitData() {

  const data =
    document.getElementById("data").value;

  const status =
    document.getElementById("status");

  status.innerText = "Sending...";

  try {

    const response = await fetch(FLOW_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        data: data
      })

    });

    if (response.ok) {

      status.innerText =
        "SUCCESS: " + data;

    } else {

      status.innerText =
        "ERROR: HTTP " + response.status;

    }

  } catch (error) {

    status.innerText =
      "ERROR: " + error.message;

  }

}

</script>

</body>
</html>
